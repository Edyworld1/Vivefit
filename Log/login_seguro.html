<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingreso Seguro (MFA) | Vive Fit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar-custom { background-color: #6196cc; }
    body { background-color: #f8f9fa; }
    #seccionMFA { display: none; }
  </style>
</head>
<body>  

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
  <div class="container">
    <a class="navbar-brand fw-bold" href="../bienvenido.html">Vive Fit</a>
    <div class="ms-auto">
      <a href="login.html" class="btn btn-light btn-sm">Regresar a inicio</a>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <div class="col-md-5 mx-auto bg-white p-4 rounded shadow">
    <div class="text-center mb-4">
        <span class="badge bg-primary mb-2">Módulo de Codificación Segura</span>
        <h3>Iniciar Sesión con Doble Factor</h3>
    </div>

    <form id="formLogin" onsubmit="return ejecutarLogin(event)">
      <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" id="correoLogin" class="form-control" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" id="passLogin" class="form-control" placeholder="Tu contraseña" required>
      </div>

      <button type="submit" class="btn btn-success w-100">Solicitar Código de Acceso</button>
    </form>

    <div id="seccionMFA" class="mt-3">
      <div class="alert alert-warning py-2 small text-center fw-bold">
        🔒 POLÍTICA DE PRIVACIDAD: Se ha generado una segunda clave de acceso de 6 dígitos. Por seguridad, expira en 5 minutos.
      </div>
      <form onsubmit="return verificarSegundaClave(event)">
        <div class="mb-3">
          <label class="form-label fw-bold">Introduce el Código de Verificación</label>
          <input type="text" id="codigoMFA" class="form-control text-center fs-4 fw-bold text-primary" placeholder="000000" required maxlength="6">
          <div class="form-text text-center text-muted">Revisa la consola de Node.js (Terminal) para ver el código simulado.</div>
        </div>
        <button type="submit" class="btn bg-primary text-white w-100">Verificar Firma e Ingresar</button>
      </form>
    </div>

  </div>
</div>

<script>
  let correoUsuario = "";

  async function ejecutarLogin(event) {
    event.preventDefault();
    correoUsuario = document.getElementById("correoLogin").value;
    const password = document.getElementById("passLogin").value;

    try {
      const respuesta = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: correoUsuario, password })
      });

      const resultado = await respuesta.json();

      if (respuesta.ok) {
        if (resultado.requiereMFA) {
          alert("🔒 [POLÍTICA DE PRIVACIDAD]: Credenciales correctas. Código MFA generado. Búscalo en la terminal de VS Code.");
          document.getElementById("formLogin").style.display = "none";
          document.getElementById("seccionMFA").style.display = "block";
        }
      } else {
        alert("Error: " + (resultado.error || "Credenciales incorrectas"));
      }
    } catch (error) {
      console.error("Error en la conexión:", error);
      alert("Error de conexión. Verifica la terminal.");
    }
  }

  async function verificarSegundaClave(event) {
    event.preventDefault();
    const codigo = document.getElementById("codigoMFA").value;

    try {
      const respuesta = await fetch('/api/verificar-mfa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: correoUsuario, codigo })
      });

      const resultado = await respuesta.json();

      if (respuesta.ok) {
        localStorage.setItem('token', resultado.token);
        alert("✔ ¡Autenticación Multifactor Exitosa!\n\nAcceso concedido bajo normativas de Privacidad de Datos.");
        window.location.href = "../bienvenido.html"; 
      } else {
        alert("Error: " + resultado.error);
      }
    } catch (error) {
      console.error("Error:", error);
      alert("Error al validar la segunda clave.");
    }
  }
</script>
</body>
</html>
